
<div class="min-h-screen bg-background text-foreground">

  <!-- Mobile Overlay -->
  @if (isSidebarOpen()) {
    <div
      class="fixed inset-0 z-40 bg-black/50 backdrop-blur-[2px] lg:hidden"
      (click)="closeSidebar()"
    ></div>
  }

  <!-- Sidebar -->
  <app-sidebar
    [isOpen]="isSidebarOpen()"
    (closeSidebar)="closeSidebar()"
  />

  <!-- Main Content -->
  <div class="min-h-screen min-w-0 lg:pl-64">

    <app-navbar
      (toggleSidebar)="toggleSidebar()"
    />

    <main class="min-h-[calc(100vh-4rem)] p-4 sm:p-6">
      <router-outlet />
    </main>

  </div>

</div>
